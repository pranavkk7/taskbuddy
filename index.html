<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskBuddy: a fast, friendly to-do list that keeps your day on track." />
    <meta name="theme-color" content="#4f46e5" />
    <title>TaskBuddy</title>
    <script>
      // Apply the saved (or system) theme before the first paint, so there is no flash.
      try {
        var saved = localStorage.getItem('taskbuddy.theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
